name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: PHP 8.4 / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: buttidesk_test
          POSTGRES_USER: buttidesk
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buttidesk -d buttidesk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DESK_DEMO_ENABLED: "true"
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'pgsql' && 'buttidesk_test' || ':memory:' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: buttidesk
      DB_PASSWORD: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, pdo_pgsql
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci --no-audit --no-fund
      - run: composer lint
      - run: composer analyse
      - run: composer test
      - run: npm run check
