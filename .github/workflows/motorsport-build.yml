name: Minecraft Motorsport 0.10.0 Racing Prototype
on:
  push:
    branches: ['scratch/motorsport-0.7-build']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat motorsport-source/chunk-{01,02,03,04}.txt | base64 --decode > /tmp/motorsport-source.tar.xz
          echo '7e3b3b81678cdfefde31c0897b34b3c76e956e7a4207a8c338c2492f6dd35996  /tmp/motorsport-source.tar.xz' | sha256sum --check
          tar -xJf /tmp/motorsport-source.tar.xz
      - name: 0.7.0 NeoForge render compatibility
        run: python3 motorsport-source/compat_patch.py
      - name: Wheel steering
        run: python3 motorsport-source/wheel_fix_071.py
      - name: Cockpit stabilization
        run: python3 motorsport-source/stability_fix_091.py
      - name: Seat refit
        run: python3 motorsport-source/cockpit_fix_092.py
      - name: Scale and contact points
        run: python3 motorsport-source/cockpit_scale_093.py
      - name: AI racing, commands, HUD, interpolation
        run: python3 motorsport-source/race_patch_010.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile against Minecraft 1.21.4 / NeoForge 21.4.158
        run: gradle --no-daemon --stacktrace build
      - name: Collect Java classes and revised sources
        if: success()
        run: |
          mkdir -p release
          cp build/libs/*.jar release/
          zip -qr release/MinecraftMotorsport-0.10.0-java-sources.zip src/main/java src/main/resources build.gradle settings.gradle gradle.properties
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MinecraftMotorsport-0.10.0-build
          path: release/*
          if-no-files-found: error
