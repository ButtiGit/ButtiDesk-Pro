name: Minecraft Motorsport 0.7 Java build
on:
  push:
    branches: ['scratch/motorsport-0.7-build']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat motorsport-source/chunk-{01,02,03,04}.txt | base64 --decode > /tmp/motorsport-source.tar.xz
          echo '7e3b3b81678cdfefde31c0897b34b3c76e956e7a4207a8c338c2492f6dd35996  /tmp/motorsport-source.tar.xz' | sha256sum --check
          tar -xJf /tmp/motorsport-source.tar.xz
          find src/main -type f | wc -l
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile NeoForge mod
        run: gradle --no-daemon --stacktrace build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MinecraftMotorsport-0.7.0-JAR
          path: build/libs/*.jar
          if-no-files-found: error
