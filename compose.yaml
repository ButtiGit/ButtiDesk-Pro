name: buttidesk-pro
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "127.0.0.1:${DESK_PORT:-8000}:8000"
    volumes:
      - .:/app
      - vendor:/app/vendor
      - node_modules:/app/node_modules
    environment:
      APP_ENV: local
      DESK_DEMO_ENABLED: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: buttidesk_demo
      DB_USERNAME: buttidesk
      DB_PASSWORD: local-demo-only
    command: >-
      sh -c "composer install --no-interaction --prefer-dist
      && php artisan desk:prepare
      && npm ci --no-audit --no-fund
      && npm run build
      && php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: buttidesk_demo
      POSTGRES_USER: buttidesk
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buttidesk -d buttidesk_demo"]
      interval: 3s
      timeout: 5s
      retries: 15
volumes:
  vendor:
  node_modules:
  postgres_data:
